name: daily-scan

on:
  schedule:
    - cron: "0 22 * * 1-5"   # weekdays 22:00 UTC, after the US market closes
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the market was closed or today already ran"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-scan

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and paper trade
        run: python daily_scan.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger_daily.csv || true
          git add docs/daily.json || true
          git diff --cached --quiet || (git commit -m "daily scan $(date -u +%F)" && git push)
