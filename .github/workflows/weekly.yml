name: weekly-invest

on:
  schedule:
    - cron: "0 17 * * 1"   # Mondays 17:00 UTC (about 9am Pacific)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to save ledger.csv back to the repo

concurrency: weekly-invest

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score and buy (paper)
        run: python weekly_investor.py
      - name: Paper portfolio report
        if: always()
        continue-on-error: true
        run: python weekly_investor.py --report
      - name: Save ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.csv || true
          git add docs/data.json || true
          git diff --cached --quiet || (git commit -m "ledger $(date -u +%F)" && git push)
