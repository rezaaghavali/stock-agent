<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Agent</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#667085;--line:#e4e7ec;--good:#12805c;--bad:#c2410c;--accent:#2f5fd0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#171d26;--text:#e8ecf2;--muted:#98a2b3;--line:#273041;--good:#3ecf9a;--bad:#fb923c;--accent:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);margin-left:6px;vertical-align:middle}
.big{font-size:34px;font-weight:700;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.muted{color:var(--muted);font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}
.bar{position:relative;flex:1;height:8px;background:var(--line);border-radius:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.t{width:54px;font-weight:600}.s{width:34px;text-align:right}.o{width:84px;text-align:right;font-size:13px}
</style>
</head>
<body>
<main id="app"><div class="card muted">Loading…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd = n => '$' + Number(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const cls = n => n >= 0 ? 'good' : 'bad';

fetch('data.json', {cache: 'no-store'})
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => { $('#app').innerHTML = '<div class="card muted">No data yet. Run the workflow once from the Actions tab.</div>'; });

function render(d) {
  const m = d.market;
  const status = m.score < d.floor ? ['Buying paused', 'bad']
    : m.score < 50 ? ['Cautious: higher bar to buy', 'bad'] : ['Normal', 'good'];
  const inv = d.positions.reduce((a, p) => a + p.invested, 0);
  const val = d.positions.reduce((a, p) => a + p.value, 0);
  const ret = inv ? 100 * (val / inv - 1) : 0;

  $('#app').innerHTML = `
    <h1>Stock Agent <span class="badge">${esc(d.mode.toUpperCase())}</span></h1>
    <div class="sub">Last run ${esc(d.updated)}</div>

    <div class="card"><h2>Market</h2>
      <div class="row" style="border:0;padding:0"><div class="big">${m.score}<span class="muted">/100</span></div>
        <div style="text-align:right"><div class="${status[1]}">${status[0]}</div>
        <div class="muted">S&amp;P vs 200-day ${pct(m.sp500_vs_200d * 100)} · VIX ${m.vix}</div></div></div></div>

    <div class="card"><h2>This week · ${usd(d.budget)} budget, ${esc(d.allocation)} split</h2>
      ${d.stocks.map(s => `<div class="row"><span class="t">${esc(s.ticker)}</span>
        <div class="bar"><i style="width:${s.score ?? 0}%"></i><b style="left:${d.threshold}%"></b></div>
        <span class="s">${s.score === null ? '–' : Math.round(s.score)}</span>
        <span class="o ${s.order ? 'good' : 'muted'}">${s.order ? 'Buy ' + usd(s.order) : 'Skip'}</span></div>`).join('')}
      <div class="muted" style="margin-top:8px">Marker = buy threshold (${d.threshold}). ${esc(d.note)}
      Unspent money: ${esc(d.if_stock_fails)}.</div></div>

    <div class="card"><h2>Portfolio</h2>
      ${d.positions.length ? `<div class="row" style="padding-top:0"><div><div class="big">${usd(val)}</div>
        <div class="muted">invested ${usd(inv)}</div></div><div class="big ${cls(ret)}">${pct(ret)}</div></div>` +
        d.positions.map(p => `<div class="row"><span class="t">${esc(p.ticker)}</span>
        <span class="muted">${usd(p.invested)} in</span><span>${usd(p.value)}</span>
        <span class="${cls(p.value - p.invested)}">${pct(100 * (p.value / p.invested - 1))}</span></div>`).join('')
        : '<div class="muted">No trades yet.</div>'}</div>

    <div class="card"><h2>Recent buys</h2>
      ${d.trades.length ? d.trades.map(t => `<div class="row"><span class="muted">${esc(t.date)}</span>
        <span class="t">${esc(t.ticker)}</span><span>${usd(t.usd)}</span></div>`).join('')
        : '<div class="muted">None yet.</div>'}</div>`;
}
</script>
</body>
</html>
